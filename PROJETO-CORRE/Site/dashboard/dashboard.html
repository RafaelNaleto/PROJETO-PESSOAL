<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRE | Dashboard</title>

    <link rel="icon" href="../img/LOGO-CORRE.png">
    <link rel="stylesheet" href="../style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bodyDash" onload="iniciarPagina()">
    <header>
        <div class="logo">
            <i><a href="../home/index.html">CORRE</a></i>
        </div>
        <nav>
            <a href="../home/index.html">Início</a>
        </nav>

    </header> 

    <h1>Performance</h1>
    <h2 id="perfilH2"></h2>
    <div class="areaDashboard">
        <div class="dashboard">
            <canvas id="grafico"></canvas>

            <div class="medidas">
                <h3>Distância: </h3>
                <input class="iptMedidas" type="number" id="ipt_distancia" placeholder="KM">
                
                <h3>Tempo: </h3>
                <div class="iptTempo">
   
                <span>Horas:  </span><br>
                <input  type="number" id="ipt_horas" placeholder="hh"><br>

                <span>Minutos:  </span><br>
                <input type="number" id="ipt_minutos" placeholder="mm">

                <span>Segundos:  </span><br>
                <input type="number" id="ipt_segundos" placeholder="ss">
                </div>
                
                <br><br>

                <button onclick="salvarMetricas()">SALVAR</button>
            </div>


        </div>

        <div class="metas">
            <h2>MÉTRICAS</h2>
            <br>
            <div class="metricas">
                <div class="cardMetrica">
                    <h4>DISTÂNICA TOTAL</h4>

                    <span id="distanciaTotal">-</span>
                </div>

                <div class="cardMetrica">
                    <h4>TEMPO TOTAL</h4>

                    <span id="tempo">-</span>
                </div>
            </div>

            <br><br><br> 

            <h2>Metas</h2>

            <div class="cardMeta">
                <h3>5 KM</h3>
                <!-- Alterar dependendo do formulário de performance -->
                <p>Correr 5km em até <b>25 min</b></p>
            </div>

            <div class="cardMeta">
                <h3>Distância</h3>
                <p>Aumentar para <b>10 km</b></p>
            </div>

            <div class="cardMeta">
                <h3>Frequência</h3>
                <p>Correr <b>4 vezes</b> por semana</p>
            </div>

            <div class="cardMeta">
                <h3>Ritmo</h3>
                <p>Manter pace abaixo de <b>5:30/km</b></p>
            </div>
        </div>
    </div>

    
    <div class="historico">
        <h2>VER CORRIDAS</h2>

        <button onclick="buscarHistorico()">VER TODAS AS CORRIDAS</button>

        <span id="historicoDeCorrida"></span>
    </div>


    
</body>
<script src="dashboard.js"></script>

</html>
