<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORRE | Cadastro</title>

    <link rel="icon" href="../img/LOGO-CORRE.png">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <div class="logo">
            <i><a href="../home/index.html">CORRE</a></i>
        </div>
        <nav>
            <a href="../home/index.html">Início</a>
        </nav>

    </header>

    <section class="auth">
        <div class="box"> 
            <h1>Cadastro</h1>

            <p>Nome Completo:</p>
            <input type="text" id="ipt_nome" placeholder=" Informe seu nome...">
<br>
            <p>E-mail:</p>
            <input type="email" id="ipt_email" placeholder=" usuario@email.com">
<br>
            <p>Senha:</p>
            <input type="password" id="ipt_senha" placeholder=" ********* ">
<br>
            <p>Confirmar Senha:</p>
            <input type="password" id="ipt_confirmar_senha" placeholder=" ********* ">
<br><br>
            <span>Já possui conta? <a href="../logCad/login.html">Login</a></span>
<br><br>
            <div class="tes">
                <button onclick="cadastrar()">Cadastrar</button>
            </div>
            
        </div>
    </section>
</body>

<script>

function cadastrar() {

    var nomeVar = ipt_nome.value;
    var emailVar = ipt_email.value;
    var senhaVar = ipt_senha.value;
    var confirmacaoSenhaVar = ipt_confirmar_senha.value;

    if (
        nomeVar == "" ||
        emailVar == "" ||
        senhaVar == "" ||
        confirmacaoSenhaVar == ""
    ) {
      //cardErro.style.display = "block";
        alert("Preencha todos os campos!");
        return false;

    } else {
        setInterval(sumirMensagem, 5000);
    }

    if (senhaVar != confirmacaoSenhaVar) {
        alert("As senhas não coincidem!");
        return false;
    }

    if (!emailVar.includes('@')) {
        alert("O e-mail precisa de '@'.")
        return false;
    }
    
    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar
        }),

    }).then(function (resposta) {

        console.log("resposta: ", resposta);
        
        if (resposta.ok) {
            //cardErro.style.display = "block";

            alert("Cadastro realizado com sucesso! Redirecionando para a avaliação de performance...");

            setTimeout(() => {
                window.location.href = "../formulario/formulario.html";
            }, 2000);
            //limparFormulario();

        } else {

            resposta.text().then((texto) => {
                console.log(texto);

                if(
                    texto.includes("Duplicate")
                ){
                    alert("Este email já está cadastrado")
                }

                
            })

        }

    }).catch(function (erro) {

        console.log(`#ERRO: ${erro}`);
        alert("Erro ao cadastrar.");

    });

    return false;
}

function sumirMensagem() {

}

</script>

</html>
